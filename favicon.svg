<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- Fond vert foncé en arc (badge) -->
  <path d="M 3,46 C 3,8 97,8 97,46 L 97,88 Q 97,97 88,97 L 12,97 Q 3,97 3,88 Z"
        fill="#0E1912"/>

  <!-- Arbre stylisé BroKa — centré x=50, y: 12→62 -->
  <g stroke="white" stroke-linecap="round" fill="none">

    <!-- Tronc -->
    <line x1="50" y1="13" x2="50" y2="61" stroke-width="2"/>

    <!-- Racines -->
    <line x1="50" y1="57" x2="40" y2="62" stroke-width="1.7"/>
    <line x1="50" y1="57" x2="60" y2="62" stroke-width="1.7"/>

    <!-- Branche paire 1 (basse) -->
    <line x1="50" y1="50" x2="28" y2="45" stroke-width="1.8"/>
    <line x1="50" y1="50" x2="72" y2="45" stroke-width="1.8"/>
    <line x1="28" y1="45" x2="22" y2="41" stroke-width="1.2"/>
    <line x1="28" y1="45" x2="22" y2="47" stroke-width="1.2"/>
    <line x1="72" y1="45" x2="78" y2="41" stroke-width="1.2"/>
    <line x1="72" y1="45" x2="78" y2="47" stroke-width="1.2"/>

    <!-- Branche paire 2 (milieu) -->
    <line x1="50" y1="38" x2="31" y2="29" stroke-width="1.7"/>
    <line x1="50" y1="38" x2="69" y2="29" stroke-width="1.7"/>
    <line x1="31" y1="29" x2="25" y2="26" stroke-width="1.1"/>
    <line x1="31" y1="29" x2="26" y2="31" stroke-width="1.1"/>
    <line x1="69" y1="29" x2="75" y2="26" stroke-width="1.1"/>
    <line x1="69" y1="29" x2="74" y2="31" stroke-width="1.1"/>

    <!-- Branche paire 3 (haute) -->
    <line x1="50" y1="27" x2="38" y2="19" stroke-width="1.4"/>
    <line x1="50" y1="27" x2="62" y2="19" stroke-width="1.4"/>
    <line x1="38" y1="19" x2="33" y2="16" stroke-width="1"/>
    <line x1="62" y1="19" x2="67" y2="16" stroke-width="1"/>

    <!-- Rameaux du sommet -->
    <line x1="50" y1="19" x2="44" y2="13" stroke-width="1.2"/>
    <line x1="50" y1="19" x2="56" y2="13" stroke-width="1.2"/>

  </g>

  <!-- Points dorés -->
  <circle cx="41" cy="25" r="2"   fill="#C9973A"/>
  <circle cx="59" cy="24" r="2"   fill="#C9973A"/>
  <circle cx="44" cy="17" r="1.6" fill="#C9973A"/>
  <circle cx="56" cy="16" r="1.6" fill="#C9973A"/>
  <circle cx="50" cy="10" r="1.5" fill="#C9973A"/>

  <!-- "BRØKA" en bas du badge -->
  <text x="50" y="87"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700"
        font-size="11.5"
        fill="white"
        text-anchor="middle"
        letter-spacing="2">BRØKA</text>

</svg>
