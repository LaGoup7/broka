<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond vert foncé arrondi -->
  <rect width="100" height="100" rx="18" fill="#112015"/>

  <!-- Flocon / arbre stylisé BroKa — 6 bras -->
  <g transform="translate(50,50)" stroke="white" stroke-linecap="round" fill="none">

    <!-- Bras principal vertical -->
    <line x1="0" y1="-33" x2="0" y2="33" stroke-width="5"/>
    <!-- Bras principal horizontal -->
    <line x1="-33" y1="0" x2="33" y2="0" stroke-width="5"/>
    <!-- Bras diagonaux -->
    <line x1="-23.3" y1="-23.3" x2="23.3" y2="23.3" stroke-width="5"/>
    <line x1="23.3" y1="-23.3" x2="-23.3" y2="23.3" stroke-width="5"/>

    <!-- Ramifications — haut -->
    <line x1="0" y1="-33" x2="-7" y2="-23" stroke-width="2.8"/>
    <line x1="0" y1="-33" x2="7" y2="-23" stroke-width="2.8"/>
    <!-- Ramifications — bas -->
    <line x1="0" y1="33" x2="-7" y2="23" stroke-width="2.8"/>
    <line x1="0" y1="33" x2="7" y2="23" stroke-width="2.8"/>
    <!-- Ramifications — gauche -->
    <line x1="-33" y1="0" x2="-23" y2="-7" stroke-width="2.8"/>
    <line x1="-33" y1="0" x2="-23" y2="7" stroke-width="2.8"/>
    <!-- Ramifications — droite -->
    <line x1="33" y1="0" x2="23" y2="-7" stroke-width="2.8"/>
    <line x1="33" y1="0" x2="23" y2="7" stroke-width="2.8"/>
    <!-- Ramifications — diagonale haut-gauche -->
    <line x1="-23.3" y1="-23.3" x2="-14" y2="-23.3" stroke-width="2.8"/>
    <line x1="-23.3" y1="-23.3" x2="-23.3" y2="-14" stroke-width="2.8"/>
    <!-- Ramifications — diagonale haut-droite -->
    <line x1="23.3" y1="-23.3" x2="14" y2="-23.3" stroke-width="2.8"/>
    <line x1="23.3" y1="-23.3" x2="23.3" y2="-14" stroke-width="2.8"/>
    <!-- Ramifications — diagonale bas-gauche -->
    <line x1="-23.3" y1="23.3" x2="-14" y2="23.3" stroke-width="2.8"/>
    <line x1="-23.3" y1="23.3" x2="-23.3" y2="14" stroke-width="2.8"/>
    <!-- Ramifications — diagonale bas-droite -->
    <line x1="23.3" y1="23.3" x2="14" y2="23.3" stroke-width="2.8"/>
    <line x1="23.3" y1="23.3" x2="23.3" y2="14" stroke-width="2.8"/>
  </g>

  <!-- Centre doré -->
  <circle cx="50" cy="50" r="5.5" fill="#C9973A"/>
</svg>
