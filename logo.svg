<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270">

  <!-- ── Fond badge en arc ── -->
  <path d="M 6,90 C 6,16 194,16 194,90 L 194,250 Q 194,264 180,264 L 20,264 Q 6,264 6,250 Z"
        fill="#0E1912"/>

  <!-- ── Halo intérieur subtil (arc lumineux) ── -->
  <path d="M 20,90 C 20,36 180,36 180,90" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="18"/>

  <!-- ══════════════════════════════════
       ARBRE STYLISÉ BRØKA
       Tronc centré x=100, y: 28→118
  ══════════════════════════════════ -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Tronc principal -->
    <line x1="100" y1="28" x2="100" y2="116" stroke-width="3.6"/>

    <!-- Racines -->
    <line x1="100" y1="110" x2="80"  y2="120" stroke-width="3"/>
    <line x1="100" y1="110" x2="120" y2="120" stroke-width="3"/>

    <!-- Branche paire 1 — la plus basse (presque horizontale) -->
    <line x1="100" y1="99"  x2="60"  y2="90"  stroke-width="3.2"/>
    <line x1="100" y1="99"  x2="140" y2="90"  stroke-width="3.2"/>
    <!-- Fourches L1 -->
    <line x1="60"  y1="90"  x2="49"  y2="83"  stroke-width="2"/>
    <line x1="60"  y1="90"  x2="49"  y2="93"  stroke-width="2"/>
    <!-- Fourches R1 -->
    <line x1="140" y1="90"  x2="151" y2="83"  stroke-width="2"/>
    <line x1="140" y1="90"  x2="151" y2="93"  stroke-width="2"/>

    <!-- Branche paire 2 — milieu (∼45°) -->
    <line x1="100" y1="76"  x2="65"  y2="61"  stroke-width="3"/>
    <line x1="100" y1="76"  x2="135" y2="61"  stroke-width="3"/>
    <!-- Fourches L2 -->
    <line x1="65"  y1="61"  x2="55"  y2="55"  stroke-width="2"/>
    <line x1="65"  y1="61"  x2="56"  y2="64"  stroke-width="2"/>
    <!-- Fourches R2 -->
    <line x1="135" y1="61"  x2="145" y2="55"  stroke-width="2"/>
    <line x1="135" y1="61"  x2="144" y2="64"  stroke-width="2"/>

    <!-- Branche paire 3 — haute (∼30°) -->
    <line x1="100" y1="55"  x2="78"  y2="41"  stroke-width="2.5"/>
    <line x1="100" y1="55"  x2="122" y2="41"  stroke-width="2.5"/>
    <!-- Fourche L3 -->
    <line x1="78"  y1="41"  x2="70"  y2="36"  stroke-width="1.8"/>
    <line x1="78"  y1="41"  x2="71"  y2="43"  stroke-width="1.8"/>
    <!-- Fourche R3 -->
    <line x1="122" y1="41"  x2="130" y2="36"  stroke-width="1.8"/>
    <line x1="122" y1="41"  x2="129" y2="43"  stroke-width="1.8"/>

    <!-- Ramifications du sommet -->
    <line x1="100" y1="39"  x2="89"  y2="29"  stroke-width="2"/>
    <line x1="100" y1="39"  x2="111" y2="29"  stroke-width="2"/>

  </g>

  <!-- ── Points dorés (baies / pommes) ── -->
  <circle cx="85"  cy="52" r="3.5"  fill="#C9973A"/>
  <circle cx="115" cy="51" r="3.5"  fill="#C9973A"/>
  <circle cx="90"  cy="37" r="2.8"  fill="#C9973A"/>
  <circle cx="110" cy="36" r="2.8"  fill="#C9973A"/>
  <circle cx="100" cy="25" r="2.5"  fill="#C9973A"/>

  <!-- ── Petits points décoratifs latéraux ── -->
  <circle cx="48"  cy="78" r="1.8"  fill="rgba(201,151,58,0.45)"/>
  <circle cx="152" cy="78" r="1.8"  fill="rgba(201,151,58,0.45)"/>

  <!-- ── Séparateur doré ── -->
  <line x1="34" y1="132" x2="166" y2="132" stroke="#C9973A" stroke-width="0.8" opacity="0.55"/>

  <!-- ══════════════════════════════════
       TEXTE
  ══════════════════════════════════ -->

  <!-- "Sagar Ozpina" en italique -->
  <text x="100" y="157"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="20"
        fill="white"
        text-anchor="middle"
        letter-spacing="0.8">Sagar Ozpina</text>

  <!-- Sous-titre produit -->
  <text x="100" y="174"
        font-family="Arial, Helvetica, sans-serif"
        font-size="7.5"
        fill="rgba(255,255,255,0.42)"
        text-anchor="middle"
        letter-spacing="3">· VINAIGRE DE CIDRE ·</text>

  <!-- "BRØKA" — marque principale -->
  <text x="100" y="212"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700"
        font-size="36"
        fill="white"
        text-anchor="middle"
        letter-spacing="6">BRØKA</text>

  <!-- Tagline géographique -->
  <text x="100" y="232"
        font-family="Arial, Helvetica, sans-serif"
        font-size="7"
        fill="rgba(255,255,255,0.32)"
        text-anchor="middle"
        letter-spacing="1.5">Garindein · Xiberoa · Euskal Herria</text>

</svg>
